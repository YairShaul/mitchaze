<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Direct phone-to-phone game state for the web version (PeerJS).
   The manager's phone holds every document of its game and is the hub:
   players connect to it with the game code, send their own writes
   (joining the lobby, votes), and it sends the whole game back to everyone.
   It offers the same small API the game uses on claude.ai (doc / collection /
   set / delete / onSnapshot), so the game code is the same in both places. */
(function () {
  window.IS_WEB = true;
  if (typeof window.Peer !== 'function') return;
  const PREFIX = 'mitchaze-impostor-v1-';
  const RTC = { config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
  ] } };
  const CLIENT_PATH = /^games\/\d{4}\/(players|votes)\/[A-Za-z0-9_-]{1,64}$/;
  const rooms = {};
  const hostCodes = new Set();
  const codeOf = path => { const m = /^games\/(\d{4})/.exec(path); return m ? m[1] : null; };
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const clone = o => JSON.parse(JSON.stringify(o));

  function makeRoom(code, asHost) {
    const r = { docs: asHost ? (lsGet('peerdb:' + code) || {}) : {}, ready: asHost, subs: new Set(), queue: [], conns: new Map(), hostConn: null, closed: false, peer: null, retryT: null };
    const notify = () => r.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
    const broadcast = () => { const msg = { t: 'state', docs: r.docs }; r.conns.forEach(c => { if (c.open) { try { c.send(msg); } catch (e) {} } }); };
    const apply = op => { if (op.t === 'set') r.docs[op.path] = op.data; else if (op.t === 'del') delete r.docs[op.path]; };
    r.write = op => {
      apply(op); notify();
      if (asHost) { lsSet('peerdb:' + code, r.docs); broadcast(); return; }
      if (r.hostConn && r.hostConn.open) { try { r.hostConn.send(op); return; } catch (e) {} }
      r.queue.push(op);
    };
    const retry = () => { if (r.closed || r.retryT) return; r.retryT = setTimeout(() => { r.retryT = null; asHost ? start() : connectHost(); }, 3000); };

    function connectHost() {
      const peer = r.peer;
      if (r.closed || !peer || peer.destroyed) return;
      if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return retry(); }
      let c;
      try { c = peer.connect(PREFIX + code, { reliable: true }); } catch (e) { return retry(); }
      let opened = false;
      const to = setTimeout(() => { if (!opened) { try { c.close(); } catch (e) {} retry(); } }, 10000);
      c.on('open', () => {
        opened = true; clearTimeout(to); r.hostConn = c;
        r.queue.splice(0).forEach(op => { try { c.send(op); } catch (e) {} });
      });
      c.on('data', d => {
        if (d && d.t === 'state' && d.docs && typeof d.docs === 'object') { r.docs = d.docs; r.ready = true; notify(); }
      });
      c.on('close', () => { clearTimeout(to); if (r.hostConn === c) r.hostConn = null; retry(); });
      c.on('error', () => {});
    }

    function start() {
      if (r.closed) return;
      const peer = asHost ? new Peer(PREFIX + code, RTC) : new Peer(RTC);
      r.peer = peer;
      peer.on('open', () => { if (!asHost) connectHost(); });
      peer.on('error', err => {
        const t = err && err.type;
        if (!asHost && t === 'peer-unavailable') { r.hostConn = null; return retry(); }
        // The code's address can stay taken for a few seconds after a reload: try again.
        if (asHost && t === 'unavailable-id') { try { peer.destroy(); } catch (e) {} return retry(); }
        if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
          if (peer.destroyed) retry();
        }
      });
      peer.on('disconnected', () => { if (!r.closed) setTimeout(() => { if (!r.closed && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } }, 2000); });
      if (asHost) {
        peer.on('connection', c => {
          c.on('open', () => { r.conns.set(c.peer, c); try { c.send({ t: 'state', docs: r.docs }); } catch (e) {} });
          c.on('data', d => {
            if (!d || typeof d.path !== 'string' || !CLIENT_PATH.test(d.path) || codeOf(d.path) !== code) return;
            if (d.t === 'set') {
              if (!d.data || typeof d.data !== 'object' || JSON.stringify(d.data).length > 4000) return;
              r.write({ t: 'set', path: d.path, data: clone(d.data) });
            } else if (d.t === 'del') r.write({ t: 'del', path: d.path });
          });
          c.on('close', () => r.conns.delete(c.peer));
          c.on('error', () => {});
        });
      }
    }
    r.close = () => { r.closed = true; clearTimeout(r.retryT); try { r.peer && r.peer.destroy(); } catch (e) {} };
    start();
    return r;
  }
  const room = code => rooms[code] || (rooms[code] = makeRoom(code, hostCodes.has(code)));

  const snap = (r, path) => ({ id: path.split('/').pop(), exists: path in r.docs, data: () => r.docs[path], metadata: { fromCache: !r.ready, hasPendingWrites: false } });
  function docRef(path) {
    const code = codeOf(path);
    return {
      path, id: path.split('/').pop(),
      get: async () => snap(room(code), path),
      set: async d => { room(code).write({ t: 'set', path, data: clone(d) }); },
      update: async d => { const r = room(code); r.write({ t: 'set', path, data: Object.assign({}, r.docs[path] || {}, clone(d)) }); },
      delete: async () => { room(code).write({ t: 'del', path }); },
      onSnapshot(next) { const r = room(code); const f = () => { if (r.ready) next(snap(r, path)); }; r.subs.add(f); setTimeout(f, 0); return () => r.subs.delete(f); },
      collection: p => colRef(path + '/' + p),
    };
  }
  function colRef(path) {
    const code = codeOf(path); const depth = path.split('/').length + 1;
    return {
      path, doc: id => docRef(path + '/' + id),
      onSnapshot(next) {
        const r = room(code);
        const f = () => {
          if (!r.ready) return;
          const ds = Object.keys(r.docs).filter(k => k.startsWith(path + '/') && k.split('/').length === depth).map(k => snap(r, k));
          next({ docs: ds, size: ds.length, empty: !ds.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] });
        };
        r.subs.add(f); setTimeout(f, 0); return () => r.subs.delete(f);
      },
    };
  }
  window.PeerDb = {
    doc: docRef, collection: colRef,
    hostRoom(code) { hostCodes.add(code); },
    leave(code) {
      Object.keys(rooms).forEach(k => { if (!code || k === code) { rooms[k].close(); delete rooms[k]; } });
      if (code) hostCodes.delete(code); else hostCodes.clear();
    },
  };
})();

</script>
</head>
<body>
<title>מתחזה</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Suez+One&display=swap">
<style>
/* Layout: one narrow column held in the hand. Carnival direction: chunky ink outlines, hard offset shadows, sticker avatars.
   The page ground changes per scene (sun = lobby, night = secret card, mint = clue round, paper = voting/results).
   Deliberately a single bright look in both OS themes. */
:root{
  --ink:#1B0B3A; --ink-muted:#5E5375; --card:#FFFFFF;
  --sun:#FFD400; --pink:#E6007E; --violet:#5B2EFF; --mint:#00C2A8; --orange:#FF7A00; --sky:#3DA9FC;
  --bg:var(--sun); --fg:var(--ink); --fg-muted:#4D3F12;
  --f-display:'Suez One','Rubik',system-ui,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
}
html[data-scene="night"]{--bg:var(--violet);--fg:#FFFFFF;--fg-muted:#DCD3FF}
html[data-scene="mint"]{--bg:var(--mint);--fg:var(--ink);--fg-muted:#0C4840}
html[data-scene="paper"]{--bg:#FFFFFF;--fg:var(--ink);--fg-muted:var(--ink-muted)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;transition:background-color .35s ease}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:3.4rem}
h2{font-size:1.8rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--fg-muted)}
.panel .muted,.choice .muted,.secret .muted{color:var(--ink-muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.center{text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:12px}
.mask{width:104px;color:var(--pink);filter:drop-shadow(4px 4px 0 var(--ink))}
.mask .hole{fill:var(--bg)}
.tag{font-size:.8rem;letter-spacing:.06em;font-weight:800;color:var(--fg-muted)}
.panel{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:1.08rem;background:var(--ink);color:var(--sun);border-bottom:5px solid var(--pink);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--fg);border:none;min-height:44px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn.ok{background:var(--mint);color:var(--ink);border-bottom-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:16px 18px;border-radius:20px;background:var(--card);color:var(--ink);border:3px solid var(--ink);width:100%;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.choice b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.choice:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.choice:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
input[type=text],input[type=tel]{font:inherit;font-weight:600;width:100%;min-width:0;padding:12px 14px;border-radius:14px;border:3px solid var(--ink);background:#FFFDF3;color:var(--ink)}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1}
.x{width:46px;height:46px;flex:none;border-radius:14px;background:var(--pink);color:#fff;font-size:1.4rem;line-height:1;border:3px solid var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#F1ECFF;padding:5px;border-radius:16px;border:3px solid var(--ink)}
.seg button{padding:10px 6px;border-radius:11px;font-weight:800;color:var(--ink-muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:.95rem;border:2px solid var(--ink)}
.chip[aria-pressed=true]{background:var(--violet);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip .n{opacity:.7;font-weight:500;font-size:.8rem;margin-inline-start:4px}
.err{background:var(--pink);color:#fff;font-weight:700;padding:10px 14px;border-radius:14px;border:3px solid var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;font-weight:700;color:var(--fg)}
.topbar .btn.ghost{color:var(--fg)}
.code{font-family:var(--f-body);font-weight:800;font-size:1.1rem;letter-spacing:.15em;font-variant-numeric:lining-nums tabular-nums;direction:ltr;unicode-bidi:isolate}
.bigcode{font-family:var(--f-body);font-weight:900;font-variant-numeric:lining-nums tabular-nums;direction:ltr;line-height:1.2;font-size:3rem;letter-spacing:.25em;color:var(--ink);text-align:center;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:4px 0}

/* sticker avatars */
.av{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;background:var(--pc,var(--sun));color:var(--pt,var(--ink));border:3px solid var(--ink)}

/* the secret card: a playing card */
.secret{position:relative;min-height:300px;margin-inline:auto;max-width:92%;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px 20px;width:100%;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.secret.back{background:var(--pink);color:#fff;transform:rotate(1.5deg);background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.22) 3px,transparent 4px);background-size:28px 28px}
.secret.back .mask{color:var(--sun)}
.secret.back .mask .hole{fill:var(--pink)}
.secret.word,.secret.imp{background:var(--card);color:var(--ink);transform:rotate(-1.5deg)}
.secret .label{font-size:.85rem;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--sun);color:var(--ink);border:2px solid var(--ink)}
.secret.imp .label{background:var(--pink);color:#fff}
.secret .big{font-family:var(--f-display);font-size:clamp(2.4rem,12vw,3.6rem);line-height:1.1;word-break:break-word}
.secret.imp .big{color:var(--violet)}
.secret .note{font-size:.95rem;color:var(--ink-muted);max-width:30ch}
/* turning the card over: the back turns away to its edge, then the face turns in */
.secret.back.flipping{animation:flip-away .22s cubic-bezier(.5,0,.9,.6) forwards;pointer-events:none}
@keyframes flip-away{from{transform:perspective(900px) rotateY(0) rotate(1.5deg)}to{transform:perspective(900px) rotateY(90deg) rotate(0) scale(1.04)}}
.reveal-in{animation:flip .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes flip{from{transform:perspective(900px) rotateY(-90deg) rotate(0) scale(1.04)}to{transform:perspective(900px) rotateY(0) rotate(-1.5deg) scale(1)}}
.secret.turning{animation:face-away .22s cubic-bezier(.5,0,.9,.6) forwards;pointer-events:none}
@keyframes face-away{from{transform:perspective(900px) rotateY(0) rotate(-1.5deg)}to{transform:perspective(900px) rotateY(90deg) rotate(0) scale(1.04)}}
.back-in{animation:back-in .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes back-in{from{transform:perspective(900px) rotateY(-90deg) rotate(0) scale(1.04)}to{transform:perspective(900px) rotateY(0) rotate(1.5deg) scale(1)}}
/* opening sections */
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:9px;height:9px;margin:-4px 4px 0;border-inline-end:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);transition:transform .3s ease,margin .3s ease}
details[open]>summary::after{transform:rotate(225deg);margin-top:4px}
details[open]>:not(summary){animation:unfold .35s ease-out both}
@keyframes unfold{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal-in,.back-in,.secret.turning,.secret.back.flipping,details[open]>:not(summary){animation:none}summary::after{transition:none}body{transition:none}.btn,.choice{transition:none}}

.pass{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0}
.pass .who{font-family:var(--f-display);font-size:2.6rem;color:var(--fg);word-break:break-word;line-height:1.1}

ol.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:o}
ol.order li{counter-increment:o;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:18px;font-weight:800;font-size:1.1rem}
ol.order li::after{content:counter(o);margin-inline-start:auto;font-family:var(--f-display);color:var(--ink-muted)}
ol.order li:first-child{box-shadow:var(--shadow)}
ol.order li:first-child::after{content:"מתחיל";font-family:var(--f-body);font-size:.8rem;font-weight:800;background:var(--pink);color:#fff;padding:3px 10px;border-radius:999px}

.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.target{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:18px;background:var(--card);color:var(--ink);border:3px solid var(--ink);font-weight:800;font-size:1.05rem;word-break:break-word;transition:transform .1s,box-shadow .1s}
.target .av{width:58px;height:58px;font-size:1.6rem}
.target[aria-pressed=true]{background:var(--pink);color:#fff;transform:scale(1.05) rotate(-2deg);box-shadow:var(--shadow)}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card);color:var(--ink)}
th,td{text-align:start;padding:10px 8px;border-bottom:2px solid #EEE8F7}
th{font-size:.8rem;color:var(--ink-muted);font-weight:800}
td.num,th.num{text-align:center}
tr:last-child td{border-bottom:none}
tr.is-imp td{background:#FFE3F2}
tr.is-imp td:first-child{font-weight:800;color:var(--pink)}
.tablewrap{overflow-x:auto;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--shadow)}
.status{display:flex;flex-wrap:wrap;gap:6px}
.status span{padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:700;background:#F1ECFF;color:var(--ink-muted);border:2px solid transparent}
.status span.done{background:var(--mint);color:var(--ink);border-color:var(--ink)}
.status button{padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:700;background:var(--card);color:var(--ink);border:2px dashed var(--ink)}
.banner{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;border:4px solid var(--ink);box-shadow:var(--shadow)}
.banner.win{background:var(--mint);color:var(--ink)}
.banner.lose{background:var(--pink);color:#fff}
.banner h2{font-size:2rem;position:relative}
.banner .tag,.banner p{color:inherit;position:relative}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;width:10px;height:16px;border:2px solid var(--ink);border-radius:2px}
.confetti i:nth-child(1){top:10%;right:6%;background:var(--sun);transform:rotate(20deg)}
.confetti i:nth-child(2){top:62%;right:12%;background:var(--violet);transform:rotate(-30deg)}
.confetti i:nth-child(3){top:18%;left:8%;background:var(--pink);transform:rotate(45deg)}
.confetti i:nth-child(4){top:70%;left:14%;background:var(--sun);transform:rotate(-12deg)}
.confetti i:nth-child(5){top:40%;right:22%;background:#fff;transform:rotate(70deg);width:8px;height:8px;border-radius:50%}
.confetti i:nth-child(6){top:35%;left:24%;background:var(--orange);transform:rotate(-55deg)}
details{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:14px 18px}
summary{cursor:pointer;font-weight:800}
details ul{margin:10px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.countdown{font-family:var(--f-body);font-weight:900;font-variant-numeric:lining-nums tabular-nums;font-size:3.2rem;line-height:1;display:block}

  const ref = S.o.db.doc('games/' + S.o.code + '/votes/' + vid);
  S.o.voteErr = '';
  const local = Object.assign({}, S.o.voteDocs); local[vid] = { round: g.round, gid: g.gid, voter, target };
  S.o.voteDocs = local; S.vote = { ready: false, pick: null, forPlayer: null }; render();
  ref.set({ round: g.round, gid: g.gid, voter, target }).catch(e => {
    const l2 = Object.assign({}, S.o.voteDocs); delete l2[vid]; S.o.voteDocs = l2;
    S.o.voteErr = (e && e.code === 'invalid_argument')
      ? 'אין לטלפון הזה הרשאה לשמור הצבעה. אמרו למארח בשקט במי בחרתם, והוא יקליד את ההצבעה בשבילכם.'
      : 'ההצבעה לא נשמרה. נסו שוב.';
    render();
  });
}

function topbar(g){

function secretCard(g, name, open){
  if (!S.reveal && !open) return `<button class="secret back${S.anim === 'back' ? ' back-in' : ''}" data-a="reveal" aria-label="הצגת הכרטיס שלי">${MASK}<span style="font-weight:700;font-size:1.1rem">לחצו כדי לראות</span><span class="small" style="opacity:.8">ודאו שאף אחד לא מציץ</span></button>`;

  return `<div class="secret word${S.anim === 'in' ? ' reveal-in' : ''}" role="status">
    <span class="label">המילה הסודית</span><span class="big">${esc(g.word)}</span>
    <span class="note">תגידו מילה קשורה, אבל לא ברורה מדי, כדי שהמתחזה לא יבין.</span></div>`;

function vReveal(g){

      ${S.reveal ? '<button class="btn alt" data-a="hide">הסתרה</button>' : ''}

  return `<div class="pass"><span class="who" style="font-size:1.6rem">${esc(name)}</span></div>${secretCard(g, name)}
    <button class="btn" data-a="reveal-next">${last ? 'הסתרה ומעבר לסבב המילים' : 'הסתרה והעברה הלאה'}</button>`;

function vClues(g){
  const host = isHost();
  return `<h2>סבב מילים</h2>
    <p class="muted">כל אחד אומר בקול מילה אחת שקשורה למילה הסודית, לפי הסדר. אפשר לעשות יותר מסיבוב אחד.</p>

    ${peekCard(g)}
    ${host ? '<button class="btn" data-a="to-vote">עוברים להצבעה</button>' : '<p class="muted center small">המארח יעביר להצבעה בסוף הסבב.</p>'}`;
}

function peekCard(g){
  if (!isOnline() || !S.o.myName) return '';
  return `<button class="btn alt" data-a="peek" aria-expanded="${S.peek}">${S.peek ? 'הסתרת הכרטיס שלי' : 'להציץ שוב בכרטיס שלי'}</button>${S.peek ? secretCard(g, S.o.myName, true) : ''}`;
}

function targetsPicker(g, voter){
  const opts = g.players.filter(p => p !== voter).map(p => `<button class="target" data-a="vote-pick" data-p="${esc(p)}" aria-pressed="${S.vote.pick === p}">${av(g, p)}<span>${esc(p)}</span></button>`).join('');
  return `<div class="targets">${opts}</div>
    <button class="btn" data-a="vote-confirm" ${S.vote.pick ? '' : 'disabled'}>${S.vote.pick ? 'מצביעים נגד ' + esc(S.vote.pick) : 'בחרו מישהו'}</button>`;
}

function vVote(g){
  if (!isOnline()) {
    const voter = g.players[g.voteIdx];
    if (!S.vote.ready) return `<h2>הצבעה סודית</h2>
      <div class="pass"><span class="tag">מצביע ${g.voteIdx + 1} מתוך ${g.players.length}</span><span class="muted">העבירו את הטלפון ל</span><span class="who">${esc(voter)}</span></div>
      <button class="btn" data-a="vote-ready">אני ${esc(voter)}, אני מוכן/ה להצביע</button>`;
    return `<h2>${esc(voter)}, מי המתחזה?</h2>${targetsPicker(g, voter)}`;
  }
  const votes = onlineVotes(g); const me = S.o.myName; const host = isHost();
  const doneCount = g.players.filter(p => p in votes).length;
  let mine;
  if (S.vote.forPlayer) mine = `<div class="panel"><h3>הצבעה בשם ${esc(S.vote.forPlayer)}</h3>${targetsPicker(g, S.vote.forPlayer)}<button class="btn ghost" data-a="vote-cancel">ביטול</button></div>`;
  else if ((me in votes) && !S.vote.changing) mine = `<div class="panel center"><h3>ההצבעה שלך נקלטה</h3><p class="muted small">הצבעת נגד ${esc(votes[me])}. אפשר לשנות עד שהמארח חושף את התוצאות.</p><button class="btn alt" data-a="vote-change">שינוי הצבעה</button></div>`;
  else mine = `<h2>מי המתחזה?</h2>${targetsPicker(g, me)}`;
  const status = `<div class="status">${g.players.map(p => (p in votes) ? `<span class="done">${esc(p)} ✓</span>` : (host && p !== me ? `<button data-a="vote-for" data-p="${esc(p)}">${esc(p)}: הצבעה בשמו</button>` : `<span>${esc(p)}</span>`)).join('')}</div>`;
  return `${mine}
    ${peekCard(g)}
    ${S.o.voteErr ? `<p class="err">${esc(S.o.voteErr)}</p>` : ''}
    <div class="panel"><h3>הצביעו ${doneCount} מתוך ${g.players.length}</h3>${status}
    ${host ? `<p class="muted small">שחקן שלא יכול להצביע מהטלפון שלו? לחצו על השם שלו והצביעו בשבילו.</p>
      <button class="btn" data-a="reveal-votes" ${doneCount ? '' : 'disabled'}>${doneCount === g.players.length ? 'חשיפת התוצאות' : 'חשיפת התוצאות בלי כולם'}</button>` : ''}</div>`;
}

function vGuess(g){
  const host = isHost();
  return `<div class="banner win"><span class="tag" style="color:inherit;opacity:.85">נתפס!</span><h2>${esc(g.impostor)} הוא המתחזה</h2><p>יש לו ניחוש אחד: מה המילה הסודית?</p></div>
    ${votesTable(g, false)}
    ${host ? (S.guessShown
      ? `<div class="secret word${S.anim === 'in' ? ' reveal-in' : ''}" style="min-height:0"><span class="label">המילה הייתה</span><span class="big">${esc(g.word)}</span></div>
         <div class="row"><button class="btn ok" style="flex:1" data-a="guess" data-v="1">ניחש נכון</button><button class="btn alt" style="flex:1" data-a="guess" data-v="0">טעה</button></div>`
      : `<p class="muted center">קודם ${esc(g.impostor)} אומר את הניחוש בקול, ואז חושפים.</p><button class="btn" data-a="guess-show">חשיפת המילה</button>`)
      : '<p class="muted center">המארח יחשוף את המילה ויסמן אם הניחוש נכון.</p>'}`;
}

function votesTable(g, withDelta){
  const t = tally(g).c;
  const rows = g.players.slice().sort((a, b) => t[b] - t[a]).map(p => `
    <tr class="${p === g.impostor && (withDelta || g.phase === 'guess') ? 'is-imp' : ''}"><td>${esc(p)}</td><td class="num">${t[p]}</td><td>${esc((g.votes || {})[p] || '—')}</td></tr>`).join('');
  return `<div class="tablewrap"><table><thead><tr><th>שחקן</th><th class="num">קולות נגדו</th><th>הצביע נגד</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function vResult(g){
  const host = isHost(); const outcome = tally(g).outcome;
  const tag = t => `<span class="tag" style="color:inherit;opacity:.85">${t}</span>`;
  let head;
  if (outcome === 'caught' && g.guessed) head = `<div class="banner lose">${tag('נתפס, אבל ניחש')}<h2>${esc(g.impostor)} ניחש את המילה</h2></div>`;
  else if (outcome === 'caught') head = `<div class="banner win">${CONFETTI}${tag('תפסתם אותו')}<h2>${esc(g.impostor)} היה המתחזה</h2></div>`;
  else if (outcome === 'tie') head = `<div class="banner lose">${tag('תיקו בהצבעה')}<h2>${esc(g.impostor)} היה המתחזה</h2></div>`;
  else head = `<div class="banner lose">${tag('המתחזה ניצח')}<h2>${esc(g.impostor)} הצליח להתחבא</h2></div>`;
  let foot;
  if (isSeries(g)) {
    const last = g.round >= g.totalRounds;
    foot = `<div class="panel center"><p>${last ? 'התוצאות הסופיות בעוד' : 'הסבב הבא מתחיל בעוד'} <b class="countdown" data-countdown>${Math.max(0, Math.ceil((g.resultAt + PAUSE_MS - Date.now()) / 1000))}</b> שניות</p>
      ${host ? `<button class="btn alt" data-a="advance">${last ? 'לתוצאות הסופיות עכשיו' : 'לסבב הבא עכשיו'}</button>` : ''}</div>`;
  } else {
    foot = host ? `<button class="btn" data-a="next-round">משחק נוסף</button><button class="btn alt" data-a="new-game">שינוי הגדרות</button>` : '<p class="muted center small">המנהל יפתח את המשחק הבא. מי שהחליף שם או הצטרף עכשיו ייכנס בו.</p>';
  }
  return `${head}
    <div class="panel"><div class="row" style="justify-content:space-between"><span><span class="muted small">המילה</span><br><b style="font-family:var(--f-display);font-size:1.5rem;font-weight:400">${esc(g.word)}</b></span><span><span class="muted small">הרמז של המתחזה</span><br><b style="font-family:var(--f-display);font-size:1.5rem;font-weight:400">${esc(g.hint)}</b></span><span><span class="muted small">קטגוריה</span><br><b>${esc(g.category)}</b></span></div></div>
    <h3>ההצבעות</h3>${votesTable(g, true)}
    ${foot}`;
}

function vFinal(g){
  const host = isHost();
  const sorted = g.players.slice().sort((a, b) => (g.scores[b] || 0) - (g.scores[a] || 0));
  const top = g.scores[sorted[0]] || 0;
  const winners = sorted.filter(p => (g.scores[p] || 0) === top);
  const sb = sorted.map(p => `<tr class="${winners.indexOf(p) >= 0 ? 'is-imp' : ''}"><td>${esc(p)}</td><td class="num"><b>${g.scores[p] || 0}</b></td></tr>`).join('');
  return `<div class="banner win">${CONFETTI}<span class="tag" style="color:inherit;opacity:.85">הסדרה הסתיימה · ${esc(g.totalRounds)} סבבים</span>
      <h2>${winners.length > 1 ? 'תיקו בין ' + winners.map(esc).join(' ו') : esc(winners[0]) + ' ניצח'}</h2><p>${top} נקודות</p></div>
    <h3>טבלת ניקוד</h3><div class="tablewrap"><table><thead><tr><th>שחקן</th><th class="num">נקודות</th></tr></thead><tbody>${sb}</tbody></table></div>
    ${host ? '<button class="btn" data-a="replay-series">סדרה חדשה עם אותם שחקנים</button><button class="btn alt" data-a="new-game">שינוי הגדרות</button>' : '<p class="muted center small">המנהל יכול לפתוח סדרה חדשה.</p>'}`;
}

function vLobby(g){
  const host = isHost();
  const names = lobbyNames().players;
  const fake = { players: names };
  const inLobby = S.o.lobby.some(p => p.pid === PID);
  return `<div class="topbar"><span>${isSeries(g) ? `סדרה של ${esc(g.totalRounds)} סבבים` : 'משחק בודד'}</span><button class="btn ghost" style="width:auto" data-a="leave">יציאה</button></div>
    <div class="panel center"><p class="muted small">קוד ההצטרפות</p><div class="bigcode">${esc(S.o.code)}</div>
      <p class="muted small">כל שחקן פותח את העמוד בטלפון שלו, כותב את השם שלו ומקליד את הקוד.</p></div>
    <h2>מי כבר כאן (${names.length})</h2>
    ${names.length ? `<div class="targets">${names.map(n => `<div class="target">${av(fake, n)}<span>${esc(n)}</span></div>`).join('')}</div>` : '<p class="muted">עוד אף אחד לא הצטרף.</p>'}
    ${!inLobby && !S.o.error ? '<p class="muted small center">מצטרפים…</p>' : ''}
    ${host ? `<button class="btn" data-a="lobby-start" ${names.length >= 3 ? '' : 'disabled'}>${names.length >= 3 ? 'כולם כאן, מתחילים' : 'צריך לפחות 3 שחקנים'}</button>`
           : '<p class="muted center">מחכים שהמנהל יתחיל את המשחק.</p>'}`;
}

function vPickName(g){
  return `<div class="topbar"><span>קוד <span class="code">${esc(S.o.code)}</span></span><button class="btn ghost" style="width:auto" data-a="leave">יציאה</button></div>
    ${isHost() ? `<div class="panel center"><p class="muted small">זה הקוד שהשחקנים צריכים להקליד:</p><div class="bigcode">${esc(S.o.code)}</div></div>` : ''}
    <h2>מי את/ה?</h2><p class="muted">בחרו את השם שלכם כדי לקבל את הכרטיס שלכם.</p>
    <div class="targets">${g.players.map(p => `<button class="target" data-a="pick-name" data-p="${esc(p)}">${av(g, p)}<span>${esc(p)}</span></button>`).join('')}</div>`;
}

function vGame(){
  const on = isOnline();
  if (on) {
    const o = S.o;
    if (!o.game) {
      return `<div class="hero">${MASK}<h2>${o.error ? 'אין חיבור למשחק' : 'מתחברים למשחק…'}</h2>${o.error ? `<p class="err">${esc(o.error)}</p>` : ''}</div>
        <button class="btn alt" data-a="leave">חזרה למסך הראשי</button>`;
    }
    if (o.game.phase === 'lobby') return vLobby(o.game) + (o.error ? `<p class="err">${esc(o.error)}</p>` : '');
    if (!o.myName) return `<div class="hero">${MASK}<h2>המשחק כבר באמצע</h2><p class="muted">נכנסת לרשימה בתור <b>${esc(myTypedName())}</b>. כשהמנהל יפתח את המשחק הבא, תהיו בו.</p></div>
        <button class="btn alt" data-a="leave">חזרה למסך הראשי</button>`;
  }
  const g = G();
  if (!g) { S.view = 'home'; return vHome(); }
  let body = '';
  if (g.phase === 'reveal') body = vReveal(g);
  else if (g.phase === 'clues') body = vClues(g);
  else if (g.phase === 'vote') body = vVote(g);
  else if (g.phase === 'guess') body = vGuess(g);
  else if (g.phase === 'final') body = vFinal(g);
  else body = vResult(g);
  const hostCode = on && isHost() && g.phase === 'reveal' ? `<div class="panel center"><p class="muted small">קוד ההצטרפות לשחקנים</p><div class="bigcode">${esc(S.o.code)}</div></div>` : '';
  return topbar(g) + hostCode + body + (on && S.o.error ? `<p class="err">${esc(S.o.error)}</p>` : '');
}

function render(){
  let h;
  if (S.view === 'setup') h = vSetup();
  else if (S.view === 'join') h = vJoin();
  else if (S.view === 'mgr') h = vMgr();
  else if (S.view === 'game') h = vGame();
  else h = vHome();
  $app.innerHTML = h;
  S.anim = null;
  document.documentElement.dataset.scene = scene();
}

/* ---------- actions ---------- */
function startGame(){
  const st = S.setup;
  const online = st.mode === 'online';
  const names = st.players.map(p => p.trim()).filter(Boolean);
  if (online) {
    if (!myTypedName()) { S.setupErr = 'כתבו את השם שלכם.'; return render(); }
  } else {
    if (names.length < 3) { S.setupErr = 'צריך לפחות 3 שחקנים עם שם.'; return render(); }
    if (new Set(names).size !== names.length) { S.setupErr = 'יש שני שחקנים עם אותו שם. שנו אחד מהם.'; return render(); }
  }
  if (st.catMode === 'pick' && !st.cats.length) { S.setupErr = 'בחרו לפחות קטגוריה אחת.'; return render(); }
  S.setupErr = '';
  if (S.reuse && !online) A.leave(); /* the manager switched this room to one phone */
  S.mode = online ? 'online' : 'local';
  const base = { players: [], scores: {}, catMode: st.catMode, cats: st.cats.slice(), used: [], round: 0, totalRounds: st.series === 'series' ? st.rounds : 0 };
  resetEphemeral();
  if (!online) {
    base.players = names; names.forEach(n => base.scores[n] = 0);
    S.view = 'game'; commit(newRound(base)); return;
  }
  base.hostId = S.o.myId || null;
  base.phase = 'lobby';
  if (S.reuse && S.o.code && S.o.game) {
    /* same room, same code: everyone connected goes straight back to the waiting room */
    const code = S.o.code; S.reuse = false; S.view = 'game';
    commit(base);
    writing = writing.then(() => joinLobby(code));
    return;
  }
  const code = String(1000 + Math.floor(Math.random() * 9000));
  S.o.host = true; S.o.myName = null; S.o.code = code; saveSession();
  if (S.o.db.hostRoom) S.o.db.hostRoom(code);
  subscribe(code);
  S.view = 'game';
  commit(base);
  writing = writing.then(() => joinLobby(code));
}
function startFromLobby(){
  const r = lobbyRoster(); if (!r) return;
  commit(newRound(Object.assign({}, G(), r, { round: 0 })));
}
/* a new game online: whoever is in the room now, under the name they chose now */
function nextOnlineGame(){
  const g = G(); const r = lobbyRoster();
  if (!r) return commit(Object.assign({}, g, { phase: 'lobby' }));
  commit(newRound(Object.assign({}, g, r, { round: 0 })));
}

const A = {
  home(){ S.view = 'home'; S.setupErr = ''; S.o.error = ''; render(); },
  open(){ S.view = S.mgr ? 'setup' : 'mgr'; S.mgrErr = ''; render(); if (!S.mgr) setTimeout(() => { const i = document.getElementById('mgrcode'); if (i) i.focus(); }, 0); },
  async 'mgr-go'(){
    if (await checkMgr(S.mgrCode)) { S.mgr = true; store.set('mgr', true); S.mgrCode = ''; S.mgrErr = ''; S.view = 'setup'; }
    else S.mgrErr = 'הקוד לא נכון.';
    render();
  },
  'mgr-off'(){ S.mgr = false; store.del('mgr'); render(); },
  'set-mode'(el){ S.setup.mode = el.dataset.v; store.set('setup', S.setup); render(); },
  'set-series'(el){ S.setup.series = el.dataset.v; store.set('setup', S.setup); render(); },
  'set-rounds'(el){ S.setup.rounds = +el.dataset.v; store.set('setup', S.setup); render(); },
  advance(){ const g = G(); if (g && g.phase === 'result' && isSeries(g)) commit(advanceSeries(g)); },
  'replay-series'(){
    if (isOnline()) return nextOnlineGame();
    const g = G(); const scores = {}; g.players.forEach(p => scores[p] = 0);
    commit(newRound(Object.assign({}, g, { scores, round: 0 })));
  },
  'continue-local'(){ S.mode = 'local'; S.view = 'game'; resetEphemeral(); render(); },
  'discard-local'(){ S.local = null; store.del('localGame'); render(); },
  'lobby-start': startFromLobby,
  'online-join'(){
    if (!myTypedName()) { S.homeErr = 'כתבו קודם את השם שלכם.'; render(); const i = document.getElementById('myname'); if (i) i.focus(); return; }
    S.homeErr = ''; S.mode = 'online'; S.o.error = ''; S.view = 'join'; render(); setTimeout(() => { const i = document.getElementById('joincode'); if (i) i.focus(); }, 0); },
  'add-player'(){ S.setup.players.push(''); store.set('setup', S.setup); render(); const i = document.getElementById('p' + (S.setup.players.length - 1)); if (i) i.focus(); },
  'del-player'(el){ S.setup.players.splice(+el.dataset.i, 1); store.set('setup', S.setup); render(); },
  'cat-mode'(el){ S.setup.catMode = el.dataset.v; store.set('setup', S.setup); render(); },
  'toggle-cat'(el){ const c = el.dataset.c, a = S.setup.cats, i = a.indexOf(c); if (i >= 0) a.splice(i, 1); else a.push(c); store.set('setup', S.setup); render(); },
  start: startGame,
  'join-go'(){
    const code = (S.joinCode || '').replace(/\D/g, '');
    if (code.length !== 4) { S.o.error = 'הקוד הוא 4 ספרות.'; return render(); }
    S.o.host = false; S.o.myName = null; S.view = 'game'; subscribe(code); saveSession(); render();
    joinLobby(code);
  },
  leave(){
    if (isOnline()) {
      if (S.o.db && S.o.code) S.o.db.doc('games/' + S.o.code + '/players/' + PID).delete().catch(() => {});
      unsubAll(); store.del('onlineSession'); flushLeave(null); S.reuse = false;
      if (S.o.db && S.o.db.leave && S.o.code) {
        const d = S.o.db, code = S.o.code;
        pendingLeave = { code, run: () => d.leave(code) }; pendingLeave.t = setTimeout(() => { pendingLeave = null; d.leave(code); }, 400);
      } S.o.game = null; S.o.code = null; S.o.myName = null; S.o.host = false; S.o.error = ''; }
    S.view = 'home'; resetEphemeral(); render();
  },
  reveal(el){
    if (!el || reducedMotion() || !el.classList.contains('back')) { S.reveal = true; S.anim = 'in'; render(); return; }
    if (turning) return;
    turning = true; turnCard(el, 1.5);
    setTimeout(() => { turning = false; S.reveal = true; S.anim = 'in'; render(); }, TURN_MS);
  },
  hide(){ turnAway(() => { S.reveal = false; S.anim = 'back'; render(); }); },
  peek(){
    if (S.peek) turnAway(() => { S.peek = false; render(); });
    else { S.peek = true; S.anim = 'in'; render(); }
  },
  'reveal-next'(){ turnAway(A['reveal-next-now']); },
  'reveal-next-now'(){
    const g = G(); S.reveal = false; S.anim = 'back';
    if (g.revealIdx >= g.players.length - 1) commit(Object.assign({}, g, { phase: 'clues' }));
    else commit(Object.assign({}, g, { revealIdx: g.revealIdx + 1 }));
  },
  'to-clues'(){ commit(Object.assign({}, G(), { phase: 'clues' })); },
  'to-vote'(){ commit(Object.assign({}, G(), { phase: 'vote', votes: {}, voteIdx: 0 })); },
  'vote-ready'(){ S.vote.ready = true; render(); },
  'vote-pick'(el){ S.vote.pick = el.dataset.p; render(); },
  'vote-for'(el){ S.vote = { ready: true, pick: null, forPlayer: el.dataset.p }; render(); },
  'vote-cancel'(){ S.vote = { ready: false, pick: null, forPlayer: null }; render(); },
  'vote-change'(){ S.vote = { ready: true, pick: null, forPlayer: null, changing: true }; render(); },
  'vote-confirm'(){
    const g = G(); const pick = S.vote.pick; if (!pick) return;
    if (!isOnline()) {
      const voter = g.players[g.voteIdx];
      const votes = Object.assign({}, g.votes); votes[voter] = pick;
      S.vote = { ready: false, pick: null, forPlayer: null };
      const ng = Object.assign({}, g, { votes, voteIdx: g.voteIdx + 1 });
      commit(ng.voteIdx >= g.players.length ? finishVoting(ng) : ng);
      return;
    }
    castOnlineVote(S.vote.forPlayer || S.o.myName, pick);
  },
  'reveal-votes'(){ const g = G(); commit(finishVoting(Object.assign({}, g, { votes: onlineVotes(g) }))); },
  'guess-show'(){ S.guessShown = true; S.anim = 'in'; render(); },
  guess(el){ commit(resolveGuess(G(), el.dataset.v === '1')); },
  'next-round'(){ if (isOnline()) nextOnlineGame(); else commit(newRound(G())); },
  'new-game'(){
    const g = G();
    if (isOnline()) { S.reuse = true; S.setup.mode = 'online'; }
    else { S.local = null; store.del('localGame'); S.setup.players = g.players.slice(); }
    store.set('setup', S.setup);
    S.setupErr = ''; S.view = 'setup'; render();
  },
  'setup-back'(){
    if (S.reuse) { S.reuse = false; S.view = 'game'; render(); } else A.home();
  }
};

/* turn the open card over before hiding it, like a real card */
let turning = false;
const TURN_MS = 230;
function turnCard(el, fromTilt){
  /* turn this card to its edge; driven from script so every phone browser plays it */
  const kf = [
    { transform: `perspective(900px) rotateY(0deg) rotate(${fromTilt}deg)` },
    { transform: 'perspective(900px) rotateY(90deg) rotate(0deg) scale(1.04)' }];
  el.style.pointerEvents = 'none';
  if (el.animate) { el.style.animation = 'none'; el.animate(kf, { duration: TURN_MS, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }); }
  else el.classList.add(el.classList.contains('back') ? 'flipping' : 'turning');
}
function turnAway(then){
  const f = document.querySelector('.secret.word, .secret.imp');
  if (!f || reducedMotion()) return then();
  if (turning) return;
  turning = true; turnCard(f, -1.5);
  setTimeout(() => { turning = false; then(); }, TURN_MS);
}
function reducedMotion(){ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return false; } }
/* open and close a section smoothly instead of all at once */
function slideDetails(d){
  if (d.dataset.anim) return;
  const from = d.offsetHeight;
  const opening = !d.open;
  d.open = true; const full = d.offsetHeight;
  d.open = false; const closed = d.offsetHeight;
  d.open = true;
  d.dataset.anim = '1'; d.style.overflow = 'hidden';
  const ms = opening ? 380 : 260;
  const a = d.animate([{ height: from + 'px' }, { height: (opening ? full : closed) + 'px' }], { duration: ms, easing: 'cubic-bezier(.2,.8,.3,1)' });
  const done = () => { if (!d.dataset.anim) return; try { a.cancel(); } catch(e) {} d.open = opening; d.style.overflow = ''; delete d.dataset.anim; };
  a.onfinish = done; setTimeout(done, ms + 80);
}
$app.addEventListener('click', e => {
  const sum = e.target.closest('summary');
  if (sum && sum.parentElement.tagName === 'DETAILS' && !reducedMotion() && sum.parentElement.animate) { e.preventDefault(); slideDetails(sum.parentElement); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = A[el.dataset.a]; if (f) f(el);
});
$app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in === 'player') { S.setup.players[+el.dataset.i] = el.value; store.set('setup', S.setup); }
  else if (el.dataset.in === 'mgr') { S.mgrCode = el.value; }
  else if (el.dataset.in === 'myname') { S.myNameInput = el.value; store.set('myName', el.value); if (S.homeErr && el.value.trim()) { S.homeErr = ''; } }
  else if (el.dataset.in === 'code') { S.joinCode = el.value.replace(/\D/g, '').slice(0, 4); if (el.value !== S.joinCode) el.value = S.joinCode; }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.dataset.in === 'code') A['join-go']();
  else if (e.target.dataset.in === 'mgr') A['mgr-go']();
  else if (e.target.dataset.in === 'player') A['add-player']();
});

/* ---------- series countdown ---------- */
let advancing = false;
setInterval(() => {
  const g = G();
  if (S.view !== 'game' || !g || g.phase !== 'result' || !isSeries(g)) { advancing = false; return; }
  const left = Math.min(PAUSE_MS / 1000, Math.max(0, Math.ceil((g.resultAt + PAUSE_MS - Date.now()) / 1000)));
  const el = document.querySelector('[data-countdown]'); if (el && el.textContent !== String(left)) el.textContent = left;
  if (left <= 0 && isHost() && !advancing) { advancing = true; commit(advanceSeries(g)); }
}, 250);

/* ---------- boot ---------- */
async function init(){
  if (S.local && S.local.phase) { /* keep on home; user can continue */ }
  render();
  const c = window.claude;
  if (window.PeerDb) { S.o.db = window.PeerDb; S.o.canWrite = true; }
  else if (c && typeof c.use === 'function') {
    try {
      const res = await Promise.all([c.use('db'), c.use('user')]);
      S.o.db = res[0];
      const user = res[1];
      if (user) { S.o.myId = await user.id(); S.o.canWrite = await user.can('data.write'); }
    } catch(e) {}
  }
  S.o.ready = true;
  const sess = store.get('onlineSession', null);
  if (sess && sess.code && S.o.db && S.view === 'home') {
    S.mode = 'online'; S.o.host = !!sess.host; S.view = 'game';
    if (sess.host && S.o.db.hostRoom) S.o.db.hostRoom(sess.code);
    subscribe(sess.code);
  }
  render();
}
init();
})();
</script>

<script>
// No zooming. iPhone Safari ignores user-scalable=no, so block its pinch and double-tap gestures here too.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
